[project]
name = "codereport"
version = "0.4.1"
description = "Make annotated code reports"
authors = [{ name = "Paul Gessinger", email = "hello@paulgessinger.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "Jinja2>=3.1.1",
    "python-slugify>=6.1.1",
    "Pygments>=2.12.0",
    "fs>=2.4.16"
]

[project.scripts]
codereport = "codereport.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.1.1",
    "mock>=4.0.3",
    "black>=22.1.0",
]

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"